[package]
name = "mangav-ipc"
version = "3.0.0"
edition = "2021"
description = "MangaV Tauri Command 强类型 IPC 桥接层"

[dependencies]
mangav-core = { path = "../core" }
mangav-ai = { path = "../ai" }
mangav-media = { path = "../media" }
mangav-plugin = { path = "../plugin" }
mangav-updater = { path = "../updater" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
