[package]
name = "novella-ipc"
version = "0.0.1"
edition = "2021"
description = "Novella Tauri Command 强类型 IPC 桥接层"

[dependencies]
novella-core = { path = "../core" }
novella-ai = { path = "../ai" }
novella-media = { path = "../media" }
novella-plugin = { path = "../plugin" }
novella-updater = { path = "../updater" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
