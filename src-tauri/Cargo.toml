[package]
name = "mangav-desktop"
version = "0.0.1"
description = "MangaV - AI 漫剧创作平台 (Tauri v2 + Rust)"
authors = ["Agions"]
license = "MIT"
repository = "https://github.com/Agions/story-weaver"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = ">=2.6.3", features = [] }

[dependencies]
mangav-core = { path = "../crates/core" }
mangav-ai = { path = "../crates/ai" }
mangav-media = { path = "../crates/media" }
mangav-plugin = { path = "../crates/plugin" }
mangav-updater = { path = "../crates/updater" }
mangav-ipc = { path = "../crates/ipc" }

tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
lazy_static = "1.4"
regex = "1"

tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
